<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Investment Memos{% endblock %}</title>
  <style>
    :root { --ink:#1a1d24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bg:#fbfbfc; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
           color:var(--ink); background:var(--bg); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; }
    a { color: var(--accent); }
    h1 { font-size: 26px; margin: 0 0 4px; }
    h2 { font-size: 19px; margin: 34px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .crumb { font-size: 13px; margin-bottom: 20px; }
    .crumb a { color: var(--muted); text-decoration: none; }
    .crumb a:hover { color: var(--accent); }
    .muted { color: var(--muted); }
    .pill { display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px;
            background:#eef2ff; color:#3730a3; font-weight:600; }
    .pill.status { background:#ecfdf5; color:#047857; }
    table { width:100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    tr:hover td { background:#f4f6fb; }
    .lead { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin:18px 0 8px; }
    .lead .rec { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
    .lead .thesis { margin:8px 0 0; }
    a.cite { text-decoration:none; font-weight:600; font-size:.85em; vertical-align:super;
             padding:0 2px; color:var(--accent); }
    a.cite:hover { text-decoration:underline; }
    figure { margin: 18px 0; }
    figure img { border:1px solid var(--line); border-radius:6px; }
    figcaption { font-size:13px; color:var(--muted); margin-top:6px; }
    .sources { list-style:none; padding:0; margin:6px 0 0; }
    .sources li { font-size:13px; padding:3px 0; }
    .quote { border-left:3px solid var(--accent); background:#fff; padding:12px 16px;
             margin:14px 0; border-radius:0 6px 6px 0; font-size:15px; }
    .kv { margin:14px 0; }
    .kv div { padding:6px 0; border-bottom:1px solid var(--line); display:flex; gap:14px; }
    .kv .k { flex:0 0 130px; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
    .actions { margin:10px 0 0; }
    .btn { display:inline-block; padding:7px 14px; border:1px solid var(--accent); border-radius:7px;
           color:var(--accent); text-decoration:none; font-size:13px; font-weight:600; }
    .btn:hover { background:var(--accent); color:#fff; }
    .empty { color:var(--muted); font-style:italic; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block crumb %}{% endblock %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
