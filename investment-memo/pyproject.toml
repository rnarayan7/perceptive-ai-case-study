[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perceptive-memo"
version = "0.1.0"
description = "Investment-memo engine (Stage 2): compute library for the Research Workstation web app."
requires-python = ">=3.9"
dependencies = [
    "anthropic",
    "click",
    "pillow",
]

# The web app backend installs this with `pip install -e ./investment-memo` and
# imports `from memo... import ...`. The Flask `app/` package is intentionally not
# packaged (it is retired; see docs/webapp-build-spec.md §3.2).
[tool.setuptools.packages.find]
include = ["memo*"]
